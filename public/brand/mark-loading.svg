<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -10 100 100" aria-hidden="true">
  <style>
    path { transform-box: fill-box; transform-origin: center; animation: assemble 1800ms cubic-bezier(.16,1,.3,1) 3 both; }
    .stem { --dx: -9px; --dy: 0px; }
    .upper { --dx: 8px; --dy: -8px; animation-delay: 100ms; }
    .lower { --dx: 8px; --dy: 8px; animation-delay: 200ms; }
    @keyframes assemble { 0%,12% { transform: translate(var(--dx),var(--dy)) scale(.9); opacity: .6; } 42%,85%,100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { path { animation: none; } }
  </style>
  <path class="stem" fill="#6D4AFF" d="M10 4h15q7 0 7 7v15q0 4-4 6l-5 3v10l5 3q4 2 4 6v15q0 7-7 7H10q-7 0-7-7V11q0-7 7-7Z"/>
  <path class="upper" fill="#0F9F8F" d="M43 7q3-3 7-3h23q5 0 5 5v12q0 3-3 5L49 40q-3 2-6 0l-8-5V20q0-4 3-7Z"/>
  <path class="lower" fill="#F6C445" d="m43 44 6-4 26 25q3 2 3 5v1q0 5-5 5H50q-4 0-7-3l-5-6q-3-3-3-7V49Z"/>
</svg>
